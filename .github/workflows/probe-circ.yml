name: probe-circ
# One-off: read one NSE circular's text. Manual only.
on:
  workflow_dispatch:
    inputs:
      circ:
        description: 'Circular file stem, e.g. CML75192'
        required: true
concurrency: probe-circ
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/probe-circ.mjs
        env:
          CIRC: ${{ inputs.circ }}
      - run: node scripts/check-no-personal-data.mjs
        if: always()
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/source-test/circ-text.json
          git commit -m "probe-circ: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
