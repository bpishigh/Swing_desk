name: fund-swingrules-test
# One-off (manual) run of C-107: the swing desk's trend template and Exit state read on mutual fund NAVs.
on:
  workflow_dispatch:
concurrency: fund-swingrules-test
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fund-swingrules-test.mjs
      - name: Commit
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/funds/backtest-swingrules.json
          git commit -m "swing trend rules on fund NAVs (C-107): $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
