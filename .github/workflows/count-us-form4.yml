name: count-us-form4
# US Batch C U-2: count of qualifying Form 4 insider purchases per year (counts only). Manual; writes data/us/count-form4.json.
on:
  workflow_dispatch:
concurrency: count-us-form4
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/count-us-form4.py
        env: { SEC_UA: "${{ secrets.SEC_UA }}" }
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/us/count-form4.json
          git commit -m "count-us-form4: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
