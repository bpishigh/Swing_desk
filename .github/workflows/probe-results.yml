name: probe-results
# One-off (18 Oct 2026): probe NSE feeds for older results dates. Manual only; delete after use.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-results-feeds.mjs
      - run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/ops/probe-results.json
          git commit -m "probe results feeds" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i * 3)); done
          exit 1
