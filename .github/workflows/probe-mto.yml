name: probe-mto
# One-off, older delivery file (MTO) depth (15 Nov 2026). Manual only.
on:
  workflow_dispatch:
concurrency: probe-mto
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-mto.mjs
      - run: node scripts/check-no-personal-data.mjs
        if: always()
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/probe-mto.json
          git commit -m "probe-mto: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
