name: probe-corp-actions
# One-off probe of NSE's corporate-actions list from the runner. Manual only.
on:
  workflow_dispatch:
concurrency: probe-corp-actions
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-corp-actions.mjs && node scripts/probe-corp-actions2.mjs
      - run: node scripts/check-no-personal-data.mjs
        if: always()
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/source-test/corp-actions-probe.json data/source-test/corp-actions-year.json data/source-test/corp-actions-windows.json
          git commit -m "probe-corp-actions: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
