name: backfill-us-bench
# C-119 support: SPY and QQQ daily bars (about 10 years) from Nasdaq's public quote API into data/us/hist-bench. Manual.
on: workflow_dispatch
concurrency: backfill-us-bench
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/backfill-us-bench.mjs
      - name: Commit
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add -A data/us/hist-bench
          git commit -m "backfill-us-bench: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
