name: probe-us-gaps
# One-off, US filings loader: which tags and period ends SEC holds for names with missing figures. Manual only.
on:
  workflow_dispatch:
concurrency: probe-us-gaps
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-us-gaps.mjs
        env: { SEC_UA: "${{ secrets.SEC_UA }}" }
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/us/probe-gaps.json
          git commit -m "probe-us-gaps: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
