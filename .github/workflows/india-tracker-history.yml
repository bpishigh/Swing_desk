name: india-tracker-history
# Adds earlier India tracker days (needed by the regime for distribution days). Manual; never overwrites a day.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many sessions back from the latest stored close'
        required: false
        default: '60'
concurrency: india-tracker-history
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/india-tracker-history.mjs --days=${{ inputs.days }}
      - run: node scripts/check-no-personal-data.mjs
        if: always()
      - name: Commit data
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/india
          git commit -m "india-tracker-history: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
