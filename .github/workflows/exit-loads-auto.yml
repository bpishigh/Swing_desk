name: exit-loads-auto
# Monthly: exit-load wording of every Direct fund, parsed. Facts only; a typed record overrides.
on:
  workflow_dispatch:
  schedule:
    - cron: '50 4 14 * *'
concurrency: exit-loads-auto
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-exitloads.mjs
      - run: node scripts/check-no-personal-data.mjs
        if: always()
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/funds/exitloads-auto.json data/funds/exitloads-log.json
          git commit -m "exit-loads-auto: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
