name: us-nightly
# Repo Desk US daily data (SPY, QQQ, 14 sector ETFs, VIX). Manual only for now: compare with the Claude Desk before any schedule is added.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'US session date YYYY-MM-DD (blank = latest session)'
        required: false
        default: ''
      backfill:
        description: 'Also write tracker and feed_hist docs for this many earlier sessions if missing (0-300)'
        required: false
        default: '0'
      backup_only:
        description: 'Test: skip Tiingo and use the Nasdaq backup only (yes/no)'
        required: false
        default: 'no'
concurrency: us-nightly
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch, check and write US data
        env:
          TIINGO_KEY: ${{ secrets.TIINGO_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
          IN_DATE: ${{ inputs.date }}
          IN_BACKFILL: ${{ inputs.backfill }}
          BACKUP_ONLY: ${{ inputs.backup_only == 'yes' && '1' || '' }}
        run: |
          ARGS="--backfill=${IN_BACKFILL:-0}"
          if [ -n "$IN_DATE" ]; then ARGS="$ARGS --date=$IN_DATE"; fi
          node scripts/us-nightly.mjs $ARGS
      - run: node scripts/check-no-personal-data.mjs
        if: always()
      - name: Commit data
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/us
          git commit -m "us-nightly: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
      - name: Regime check and phone message
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git pull --rebase origin main
          node scripts/regime-run.mjs us
          git add data/us/regime.json
          git commit -m "regime us: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
