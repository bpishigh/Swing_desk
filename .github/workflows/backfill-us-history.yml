name: backfill-us-history
# About 10 years of daily bars from Nasdaq's public quote API for today's liquid US common stocks (listed names only; no delisted). Manual and resumable.
on:
  workflow_dispatch:
    inputs:
      limit: { description: 'Only the first N symbols by dollar volume (blank = all)', required: false, default: '' }
concurrency: backfill-us-history
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/backfill-us-history.mjs ${{ github.event.inputs.limit != '' && format('--limit={0}', github.event.inputs.limit) || '' }}
      - name: Commit
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add -A data/us/hist data/us/hist-meta.json
          git commit -m "backfill-us-history: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
