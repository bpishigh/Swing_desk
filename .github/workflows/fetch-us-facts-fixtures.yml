name: fetch-us-facts-fixtures
# One-off, US filings loader: real SEC company-facts files for six companies, trimmed, as test fixtures. Manual only.
on:
  workflow_dispatch:
concurrency: fetch-us-facts-fixtures
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-us-facts-fixtures.mjs
        env: { SEC_UA: "${{ secrets.SEC_UA }}" }
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add fixtures/us-facts
          git commit -m "fetch-us-facts-fixtures: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
