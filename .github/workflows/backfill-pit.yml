name: backfill-pit
# Insider (SEBI PIT) disclosures, market-wide, promoter/director/KMP rows only, into data/india/pit. Manual and resumable.
on:
  workflow_dispatch:
    inputs:
      from: { description: "First month (YYYY-MM)", default: "2016-01" }
      to: { description: "Last month (YYYY-MM)", default: "2025-12" }
concurrency: backfill-pit
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/backfill-pit.mjs --from=${{ inputs.from }} --to=${{ inputs.to }}
      - run: node scripts/check-no-personal-data.mjs
        if: always()
      - name: Commit files
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/india/pit
          git commit -m "backfill-pit: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
