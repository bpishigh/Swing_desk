name: time-filings
# One-off timing probe for the filings backfill. Manual only; commits nothing.
on:
  workflow_dispatch:
concurrency: time-filings
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/time-filings.mjs
