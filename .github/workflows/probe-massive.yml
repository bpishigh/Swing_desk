name: probe-massive
# One-off: free-plan history depth, delisted names on past dates, and split adjustment for Massive grouped daily bars. Manual only.
on:
  workflow_dispatch:
concurrency: probe-massive
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-massive.mjs
        env:
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
      - run: node scripts/check-no-personal-data.mjs
        if: always()
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/source-test/massive-probe.json
          git commit -m "probe-massive: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
