name: probe-nse-industry
# One-off: can the runner read NSE per-stock industry and the Microcap 250 list? Manual only; writes data/india/probe-industry.json.
on:
  workflow_dispatch:
concurrency: probe-nse-industry
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-nse-industry.mjs
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/india/probe-industry.json
          git commit -m "probe-nse-industry: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
