name: tick
# The lean half-hourly check. Started by cron-job.org (workflow_dispatch). Starts the India and US jobs that are due, sends the
# "still missing" alerts, and once a day writes the Actions-minutes estimate. No data probing and no npm install: about 15 seconds.
# Replaces the dispatch steps of source-test.yml (kept until cron-job.org points here).
on:
  workflow_dispatch:
    inputs:
      now:
        description: 'Test only: pretend it is this time (ISO, e.g. 2026-10-12T14:00:00Z). Blank in normal use.'
        required: false
        default: ''
concurrency: tick
permissions:
  contents: write
  actions: write      # lets the tick start the other workflows
jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: India jobs
        continue-on-error: true
        run: node scripts/dispatch-nightly.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOW_OVERRIDE: ${{ inputs.now }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: US jobs
        continue-on-error: true
        run: node scripts/dispatch-us.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOW_OVERRIDE: ${{ inputs.now }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Actions minutes (once a day)
        continue-on-error: true
        run: node scripts/usage-report.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Rebuild dashboard data
        continue-on-error: true
        run: node scripts/build-site.mjs
      - name: Commit state if it changed
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/india/orchestrator.json data/us/orchestrator.json data/ops/usage.json site/data/dashboard.json site/data/docs.json
          git diff --cached --quiet && exit 0
          git commit -m "tick: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
