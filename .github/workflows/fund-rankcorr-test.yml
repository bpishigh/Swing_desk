name: fund-rankcorr-test
# One-off (manual) run of C-104 (holdings-health proxy back-test) and C-105 (rank-correlation re-test of thematic and international scores).
on:
  workflow_dispatch:
concurrency: fund-rankcorr-test
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --max-old-space-size=6000 scripts/fund-rankcorr-test.mjs
      - name: Commit
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/funds/backtest-holdhealth.json data/funds/backtest-rankcorr.json
          git commit -m "holdings-health proxy back-test and rank-correlation re-test (C-104, C-105): $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
