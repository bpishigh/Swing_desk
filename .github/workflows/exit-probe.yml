name: exit-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-exitload.mjs
      - run: |
          git config user.name "swing-desk-bot"; git config user.email "noreply@github.com"
          git add data/ops/exit-probe.json; git commit -m "exit probe" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 3; done
