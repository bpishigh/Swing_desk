name: fund-scores
# Daily fund scoring (FUND-3). Refreshes the AMFI scheme list, fetches NAV history for the Direct-Growth schemes, scores them within category, commits data/funds. The half-hourly tick rebuilds site/data/funds.json from it.
# Daily since 23 Oct 2026 (was monthly): the month's history entry is overwritten each day, so the monthly Weak-fund count still sees the last run of each month.
on:
  workflow_dispatch:
  schedule:
    - cron: '41 21 * * *'   # daily, 03:11 IST: AMFI publishes the day's NAVs by late evening
concurrency: fund-scores
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: AMFI scheme list (public NAV file)
        run: node scripts/fetch-amfi-master.mjs
      - name: "Expense ratios (AMFI; days 1 to 3 of the month, or when started by hand)"
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%d)" -le 3 ]; then node scripts/fetch-ter.mjs; else echo skipped; fi
      - name: Score funds
        id: score
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/fund-scores.mjs 2>&1 | tee scores-run.log
      - name: Keep the tail of a failed run (the Actions log cannot be read from outside)
        if: steps.score.outcome == 'failure'
        run: |
          mkdir -p data/ops
          { date -u; tail -n 60 scores-run.log; } > data/ops/fund-scores-failure.log || true
      - name: Commit
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/funds data/rules/amfi-schemes.json data/ops/fund-scores-failure.log 2>/dev/null || git add data/funds data/rules/amfi-schemes.json
          git commit -m "fund scores: $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0   # this job owns data/funds: on a clash (two runs close together) its own newer files win
            sleep $((i * 3))
          done
          exit 1
      - name: Fail if scoring failed
        if: steps.score.outcome == 'failure'
        run: exit 1
