name: fund-scores
# Weekly fund scoring (FUND-1, phase 1). Fetches NAV history for ~620 Direct-Growth equity/hybrid schemes, scores them within category, commits data/funds.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 0'
concurrency: fund-scores
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Score funds
        run: node scripts/fund-scores.mjs
      - name: Commit
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/funds
          git commit -m "fund scores: $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
