name: stock-facts
# Monthly: business facts and promoter pledge for the most traded listed stocks (scope K3). Results land by mid-month. Facts only.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 16 * *'
concurrency: stock-facts
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-stockfacts.mjs
      - run: node scripts/check-no-personal-data.mjs
        if: always()
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/stocks/facts.json data/stocks/facts-log.json
          git commit -m "stock-facts: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
