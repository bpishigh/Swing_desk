name: backfill-us-sic
# SIC codes for the US scan's group step (SEC first, Massive for the few it misses). Resumable: only tickers not yet stored are fetched.
# Monthly picks up new listings; run by hand with refresh=true once a quarter to re-read every code.
on:
  schedule:
    - cron: '15 3 1 * *'
  workflow_dispatch:
    inputs:
      refresh: { description: 'Re-read every code (quarterly)', required: false, default: 'false' }
concurrency: backfill-us-sic
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/backfill-us-sic.mjs ${{ github.event.inputs.refresh == 'true' && '--refresh' || '' }}
        env: { POLYGON_KEY: "${{ secrets.POLYGON_KEY }}" }
      - name: Commit
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add -A data/us
          git commit -m "backfill-us-sic: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
