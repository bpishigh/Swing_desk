name: fund-backtest
# One-off (manual) run of the fund-score back-test, Engine Rules C-81: fetches NAV history for the scored Direct-Growth schemes, runs the fixed test, commits data/funds/backtest.json and the report.
on:
  workflow_dispatch:
concurrency: fund-backtest
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Back-test
        run: node scripts/fund-backtest.mjs
      - name: Commit
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/funds/backtest.json data/funds/backtest-v2.json data/funds/backtest-v3.json data/funds/backtest-index.json data/funds/backtest-category.json docs/replay
          git commit -m "fund-score back-test (C-81): $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
