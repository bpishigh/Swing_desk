name: earnings-forward
# Weekly forward paper test of the results-day rule (C-61, registered 18 Oct 2026). Logs new results events and fills in the 20-session outcome. Nothing trades or alerts.
on:
  workflow_dispatch:
  schedule:
    - cron: '45 3 * * 6'
concurrency: earnings-forward
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --max-old-space-size=4000 scripts/earnings-forward.mjs
      - run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/india/earnings-forward.json data/india/results-dates.json
          git commit -m "earnings forward test: weekly update" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep $((i * 3)); done
          exit 1
