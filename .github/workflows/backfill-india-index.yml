name: backfill-india-index
# Backtester data: NSE index close files for the 2020-2025 sessions already stored in data/india/bhav-hist, into data/india/idx-hist. Manual and resumable.
on:
  workflow_dispatch:
concurrency: backfill-india-index
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/backfill-india-index.mjs
      - run: node scripts/check-no-personal-data.mjs
        if: always()
      - name: Commit files
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/india/idx-hist
          git commit -m "backfill-india-index: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
