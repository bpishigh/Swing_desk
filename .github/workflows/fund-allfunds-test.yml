name: fund-allfunds-test
# One-off (manual) run of the all-funds cross-group allocation test, Engine Rules C-100: fetches NAV history for every scored Direct-Growth scheme and ETF, runs the fixed test, commits data/funds/backtest-allfunds.json.
on:
  workflow_dispatch:
concurrency: fund-allfunds-test
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Back-test
        run: node scripts/fund-allfunds-test.mjs
      - name: Commit
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/funds/backtest-allfunds.json
          git commit -m "all-funds allocation test (C-100): $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
