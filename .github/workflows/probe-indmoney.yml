name: probe-indmoney
# One-off: which fund-quality facts the public fund page carries (managers, AUM, benchmark, exit-load history). Manual only.
on:
  workflow_dispatch:
concurrency: probe-indmoney
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: SRC=cleartax node scripts/probe-indmoney.mjs
      - run: SRC=5paisa node scripts/probe-indmoney.mjs
      - run: node scripts/check-no-personal-data.mjs
        if: always()
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/funds/indmoney-probe-cleartax.json data/funds/indmoney-probe-5paisa.json
          git commit -m "probe-indmoney: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
