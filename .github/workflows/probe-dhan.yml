name: probe-dhan
# One-off: read a Dhan stock page from the runner. The address is a run input, not stored in the repo. Manual only.
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'dhan.co stock page address'
        required: true
concurrency: probe-dhan
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-dhan.mjs
        env:
          DHAN_URL: ${{ inputs.url }}
      - run: node scripts/check-no-personal-data.mjs
        if: always()
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/source-test/dhan-probe.json
          git commit -m "probe-dhan: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
