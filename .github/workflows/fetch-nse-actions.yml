name: fetch-nse-actions
# One-off: Full NSE corporate-actions history, one call per year. Manual only.
on:
  workflow_dispatch:
    inputs:
      from_year: { description: "First year", default: "2019" }
      to_year: { description: "Last year (blank = this year)", default: "" }
      out: { description: "Output file", default: "data/india/corp-actions-history.json" }
concurrency: fetch-nse-actions
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-nse-actions-history.mjs --from-year=${{ inputs.from_year || '2019' }} ${{ inputs.to_year && format('--to-year={0}', inputs.to_year) || '' }} --out=${{ inputs.out || 'data/india/corp-actions-history.json' }}
      - run: node scripts/check-no-personal-data.mjs
        if: always()
      - name: Commit result
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/india/corp-actions-history*.json
          git commit -m "fetch-nse-actions: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
