name: fund-index-rankcorr-test
# One-off (manual) run of C-110 (rank-correlation test of the index funds).
on:
  workflow_dispatch:
concurrency: fund-index-rankcorr-test
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --max-old-space-size=6000 scripts/fund-index-rankcorr.mjs
      - name: Commit
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/funds/backtest-indexrank.json
          git commit -m "index-rankcorr-fund rank-correlation test (C-110): $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
