name: ci
on:
  workflow_dispatch:   # manual only from 21 Oct 2026: GitHub shows 1,971 of 2,000 minutes used; tests and the privacy script run locally before each push
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # a newer push makes the older check pointless; saves Actions minutes
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Privacy check (deny-list comes from the PRIVACY_DENYLIST secret, never from the repo)
        run: node scripts/check-no-personal-data.mjs
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
      - run: npm test
