name: india-stocks
# Repo Desk India whole-market stock store. Manual only for now: compare with the Claude Desk before any schedule is added.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Session date YYYY-MM-DD (blank = latest session)'
        required: false
        default: ''
      backfill:
        description: 'Also make sure this many earlier sessions are stored (0-300)'
        required: false
        default: '0'
concurrency: india-stocks
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    env:
      HAS_PORTFOLIO: ${{ secrets.PORTFOLIO_TOKEN != '' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Store sessions and build stock stats
        env:
          IN_DATE: ${{ inputs.date }}
          IN_BACKFILL: ${{ inputs.backfill }}
        run: |
          ARGS="--backfill=${IN_BACKFILL:-0}"
          if [ -n "$IN_DATE" ]; then ARGS="$ARGS --date=$IN_DATE"; fi
          node scripts/india-stocks.mjs $ARGS
      - name: Alert on new unresolved corporate-action breaks
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG=$(node -e "const r=JSON.parse(require('fs').readFileSync('data/india/last-run-stocks.json','utf8'));const n=r.newUnresolved||[];const cp=r.circularProblems||[];const p=[];if(n.length)p.push(n.length+' new price break(s) with no usable corporate action, averages left out: '+n.slice(0,12).map(x=>x.replace('|',' ')).join(', ')+(n.length>12?' ...':''));if(cp.length)p.push('NSE circular check: '+cp.slice(0,8).join('; '));if(p.length)console.log('India stocks '+r.date+': '+p.join(' | '))")
          if [ -n "$MSG" ]; then node scripts/alert.mjs "$MSG"; fi
      - name: Breadth (Nifty 500 above its 50-day average)
        continue-on-error: true
        run: node scripts/breadth-india.mjs
      - name: Market-cap segments (Nifty 100, Midcap 150, Smallcap 250 lists, weekly)
        continue-on-error: true
        run: node scripts/segments-india.mjs
      - run: node scripts/check-no-personal-data.mjs
        if: always()
      - name: Commit data
        if: always()
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add data/india
          git commit -m "india-stocks: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
      - name: Regime check and phone message
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git pull --rebase origin main
          node scripts/regime-run.mjs india
          git add data/india/regime.json
          git commit -m "regime india: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
      - name: India whole-market scan (IND-SCAN-1) and paper book (IND-PAPER-1)
        if: always()
        continue-on-error: true
        run: |
          git pull --rebase origin main
          node --max-old-space-size=6000 scripts/india-scan.mjs
          node --max-old-space-size=6000 scripts/paper-book-india.mjs
          node scripts/save-shortlist.mjs || true
          node scripts/scan-earnings.mjs india || true
          node --max-old-space-size=4000 scripts/scan-last-reaction.mjs india || true
          node scripts/momentum-forward.mjs india || true
          mkdir -p data/india/scan data/india/paper
          git add data/india/scan data/india/paper data/india/shortlist data/india/momentum data/india/momentum-forward.json
          git commit -m "india-scan: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
      - name: Personal data store (separate private repo; skipped until PORTFOLIO_TOKEN is set)
        if: ${{ env.HAS_PORTFOLIO == 'true' }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: bpishigh/swing_desk_portfolio
          token: ${{ secrets.PORTFOLIO_TOKEN }}
          path: .portfolio-repo
          ref: main
      - name: Position alerts (open trades and kept Legacy holdings; moved from the Claude Desk)
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git -C .portfolio-repo rev-parse --verify -q HEAD >/dev/null 2>&1 || { echo "private data store not attached or empty: skipped"; exit 0; }
          mkdir -p .portfolio-repo/portfolio/accounts .portfolio-repo/portfolio/book
          ln -sfn .portfolio-repo/portfolio portfolio
          git pull --rebase origin main
          node --max-old-space-size=6000 scripts/book-alerts.mjs india
          node --max-old-space-size=6000 scripts/holding-alerts.mjs
          # the book files live in the separate private repo (top-level portfolio/ folder) checked out at .portfolio-repo and linked as portfolio/; commit and push there
          cd .portfolio-repo
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git add portfolio/book
          git commit -m "book alerts india: $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
      - name: Company names for the dashboard hover text
        if: always()
        continue-on-error: true
        run: |
          git config user.name "swing-desk-bot"
          git config user.email "noreply@github.com"
          git pull --rebase origin main
          node scripts/fetch-names.mjs
          git add data/names.json
          git commit -m "names: $(date -u +%Y-%m-%d)" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
