<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio Manager</title>
<meta name="robots" content="noindex">
<style>
:root { --bg:#f5f4f0; --panel:#fff; --ink:#1d2327; --muted:#5d6870; --line:#e3e0d8; --accent:#1f5f8b; --accent-bg:#e3eef6; --green:#17693a; --green-bg:#e1f1e7; --red:#a1261b; --red-bg:#f8e4e1; --yellow:#7a5a00; --yellow-bg:#f8ecc4; --font: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono: ui-monospace,Menlo,Consolas,monospace; }
@media (prefers-color-scheme: dark) { :root { --bg:#14181b; --panel:#1c2226; --ink:#e6e9ea; --muted:#98a3a9; --line:#323b41; --accent:#6cb2e0; --accent-bg:#1d3342; --green:#6fd197; --green-bg:#16301f; --red:#ff8f84; --red-bg:#3a1b18; --yellow:#e8c45c; --yellow-bg:#3b3210; color-scheme: dark; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 var(--font); }
.wrap { max-width:1080px; margin:0 auto; padding:0 16px 40px; }
.bar { padding:12px 0 0; border-bottom:1px solid var(--line); }
.bar .r { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.grow { flex:1; }
button, select, input { font:inherit; color:inherit; }
button { cursor:pointer; }
.btn { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; } .btn:disabled { opacity:.5; cursor:default; }
.ghost { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 12px; }
.sw { position:relative; } .sw > .ghost { font-weight:600; font-size:15px; min-width:210px; text-align:left; }
.menu { position:absolute; top:calc(100% + 4px); left:0; min-width:270px; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.18); padding:6px; z-index:10; }
.menu button { display:flex; justify-content:space-between; gap:12px; width:100%; background:none; border:0; text-align:left; padding:7px 10px; border-radius:6px; } .menu button:hover, .menu button[aria-current=true] { background:var(--accent-bg); }
.menu .h { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:8px 10px 2px; }
.menu input { width:100%; border:1px solid var(--line); border-radius:6px; padding:7px 9px; background:var(--bg); margin-top:6px; }
.seg { display:flex; flex-wrap:wrap; gap:4px; } .seg button { background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:5px 12px; font-size:13px; } .seg button[aria-pressed=true] { background:var(--accent); border-color:var(--accent); color:#fff; }
.tabs { display:flex; gap:2px; margin-top:8px; overflow-x:auto; } .tabs button { background:none; border:0; border-bottom:2px solid transparent; padding:7px 14px; color:var(--muted); font-weight:500; } .tabs button[aria-selected=true] { color:var(--ink); border-color:var(--accent); }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin:14px 0; }
.card h2 { font-size:14px; margin:0 0 10px; font-weight:600; } .sub { color:var(--muted); font-size:12.5px; }
.verdict { border-left:5px solid var(--muted); font-size:17px; line-height:1.4; } .verdict.good { border-color:var(--green); background:var(--green-bg); } .verdict.bad { border-color:var(--red); background:var(--red-bg); } .verdict.flat { border-color:var(--yellow); background:var(--yellow-bg); }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:12px; margin:14px 0; }
.tile { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
.tile .k { font-size:12px; color:var(--muted); display:flex; justify-content:space-between; } .tile .v { font:600 26px/1.2 var(--font); margin:4px 0 2px; letter-spacing:-.01em; } .tile .s { font-size:12.5px; color:var(--muted); }
.pos { color:var(--green); } .neg { color:var(--red); }
.chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; } .chip { font-size:11.5px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); background:var(--bg); cursor:pointer; } .chip[aria-pressed=true] { border-color:var(--accent); background:var(--accent-bg); }
.hr { cursor:pointer; } .hr:hover td { background:var(--line); } .ctxrow td { text-align:left; white-space:normal; background:var(--card); } .ctx { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px 16px; } .ctx div { text-align:left; }
.why { display:block; color:var(--muted); font-size:11px; white-space:normal; max-width:260px; text-align:left; }
.tag { font-size:11px; padding:1px 7px; border-radius:999px; background:var(--yellow-bg); color:var(--yellow); white-space:nowrap; } .tag.ok { background:var(--green-bg); color:var(--green); } .tag.bad { background:var(--red-bg); color:var(--red); }
.tw { overflow-x:auto; } table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; } th, td { text-align:right; padding:7px 9px; border-bottom:1px solid var(--line); white-space:nowrap; } th:first-child, td:first-child { text-align:left; white-space:normal; min-width:150px; } th { color:var(--muted); font-weight:500; font-size:12.5px; } th[data-sort] { cursor:pointer; user-select:none; } tfoot td { font-weight:600; border-top:2px solid var(--line); border-bottom:0; } tr.hi td { background:var(--accent-bg); }
td small { display:block; color:var(--muted); font-size:11.5px; }
.note { background:var(--yellow-bg); color:var(--yellow); border-radius:8px; padding:8px 11px; margin:8px 0; font-size:13px; } .note.info { background:var(--accent-bg); color:var(--ink); }
.chartbox { position:relative; } .tip { position:absolute; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.15); white-space:nowrap; display:none; }
.legend { display:flex; gap:16px; font-size:12px; color:var(--muted); margin-top:4px; } .legend i { display:inline-block; width:18px; height:0; border-top:3px solid var(--accent); vertical-align:middle; margin-right:5px; } .legend i.d { border-top:2px dashed #888; }
.bar2 { height:6px; border-radius:3px; background:var(--accent-bg); } .bar2 > i { display:block; height:100%; border-radius:3px; background:var(--accent); }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; } .grid2 .card { margin:0; }
.drawer { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin:12px 0; } .drawer .f { display:flex; flex-wrap:wrap; gap:10px; align-items:end; } .drawer label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:3px; } .drawer input, .drawer select { border:1px solid var(--line); border-radius:6px; padding:7px 9px; background:var(--bg); }
.row2 { display:flex; flex-wrap:wrap; gap:8px; align-items:center; } .pxin { border:1px solid var(--line); border-radius:6px; padding:4px 8px; background:var(--bg); }
.empty { text-align:center; padding:44px 12px; color:var(--muted); }
input[type=search] { border:1px solid var(--line); border-radius:8px; padding:6px 10px; background:var(--panel); min-width:200px; }
@media (max-width:640px) { .tile .v { font-size:22px; } .sw > .ghost { min-width:0; } }
#toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:8px; font-size:13px; max-width:90%; z-index:20; display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="r">
      <div class="sw" id="sw"></div>
      <span class="grow"></span>
      <button class="ghost" id="addBtn">＋ Add files</button>
    </div>
    <div class="seg" id="per" style="margin-top:10px"></div>
    <div class="tabs" id="tabs" role="tablist"></div>
  </div>
  <div class="drawer" id="drawer" hidden>
    <div class="f">
      <label>Tradebook files (CSV or Excel) <input type="file" id="files" multiple accept=".csv,.xlsx"></label>
      <label>Account <input id="label" list="acctList" placeholder="pick or type a new name" size="18"><datalist id="acctList"></datalist></label>
      <label>Owner (whose PAN) <input id="owner" list="ownerList" placeholder="e.g. Owner" size="12"><datalist id="ownerList"></datalist></label>
      <label>Broker <select id="broker"><option value="auto">Detect from files</option><option value="groww">Groww</option><option value="zerodha">Zerodha</option></select></label>
      <label class="sub" id="saveBox" hidden style="flex-direction:row;align-items:center;gap:6px"><input type="checkbox" id="save" checked> Save to my private store</label>
      <button class="btn" id="run" disabled>Add</button>
    </div>
    <div class="sub" id="status" style="margin-top:8px">Loading public data…</div>
    <div class="sub" style="margin-top:4px">Files are read in your browser. If Save is on, only clean transactions (no client code, name or PAN) go to your private repo. Adding to an existing account merges and ignores repeated rows. Pick one broker's files per account; stocks and funds can go together.</div>
  </div>
  <div id="main"></div>
<div id="toast" role="status"></div>
</div>
<script type="module">
import { parseCsv } from './pm/csv.js';
import { readXlsxAsync } from './pm/xlsx.js';
import { readRows, mergeTrades } from './pm/reader.js';
import { runPipeline } from './pm/pipeline.js';
import { analyse, momentum, verdict, periods, sumSeries, BENCHMARKS, windowReturn } from './pm/insight.js';
import { mergeTax, fy } from './pm/tax.js';
import { stockVerdict, adjustSeries } from './pm/verdict.js';
import { reviewTrade, patterns, stopSummary } from './pm/tradereview.js';
import { segmentOf } from './pm/segment.js';
import { allocate, currentByClass, gapRows, capBreaches, rollUp, TARGET_CLASSES } from './pm/allocation.js';
import { routeNewMoney, planSales, sellNeeds } from './pm/rebalance.js';
import { derivePools, householdChecks, routeTrade } from './pm/swingpools.js';
import { sizeOrders, openRiskOf } from './pm/swingorders.js';
import { journalReport } from './pm/swingjournal.js';
import { isLong, applyQuarterCap } from './pm/rebalance.js';
import { orderCharges } from './pm/charges.js';
const $ = (id) => document.getElementById(id);
const J = (f) => fetch('pm-data/' + f + '.json').then((r) => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); });
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const keyOf = (l) => l.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const store = { get(k, d) { try { return localStorage.getItem('pm.' + k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem('pm.' + k, v); } catch {} } };

// ---------- formatting
const inr = (x) => Math.round(x).toLocaleString('en-IN');
const money = (x) => (x < 0 ? '−' : '') + '₹' + inr(Math.abs(x));
const short = (x) => { const a = Math.abs(x), s = x < 0 ? '−' : ''; return a >= 1e7 ? s + '₹' + (a / 1e7).toFixed(2) + ' Cr' : a >= 1e5 ? s + '₹' + (a / 1e5).toFixed(2) + ' L' : s + '₹' + inr(a); };
const pct = (x, d = 1) => (x === null || x === undefined || !Number.isFinite(x) ? '–' : (x * 100).toFixed(d) + '%');
const pts = (x) => (x === null ? '–' : (x >= 0 ? '+' : '−') + Math.abs(x * 100).toFixed(1) + ' pts');
const cls = (x) => (x < 0 ? 'neg' : x > 0 ? 'pos' : '');
const num = (x) => `<span class="${cls(x)}">${inr(x)}</span>`;

// ---------- state
const S = { track: null, ctx: null, regime: null, open: new Set(), accounts: new Map(), sel: store.get('sel', 'ALL'), period: store.get('period', 'all'), bench: store.get('bench', 'n50'), allocCfg: null, alloc: (() => { try { return JSON.parse(store.get('alloc', '')) || {}; } catch { return {}; } })(), tab: 'home', navs: {}, fundNavs: undefined, fundOn: store.get('fund', '1') === '1', data: null, hist: null, canSave: false, menu: false, sort: { k: 'value', d: -1 }, kind: 'All', vf: 'All', q: '', benchStatus: '', segments: null };
const ownerOf = (a) => a.owner || 'Unassigned';
const reports = () => [...S.accounts.values()].filter((a) => a.report);

// ---------- data loading
let histP;
function loadHist() { return (histP ??= (async () => {
  const months = await J('prices/index'); const parts = await Promise.all(months.map((m) => J('prices/' + m)));
  const dates = [], px = {}; let off = 0;
  for (const c of parts) { for (const [sym, a] of Object.entries(c.px)) { const t = (px[sym] ??= new Array(off).fill(null)); while (t.length < off) t.push(null); for (let i = 0; i < c.dates.length; i++) t.push(a[i] ?? null); } dates.push(...c.dates); off += c.dates.length; for (const a of Object.values(px)) while (a.length < off) a.push(null); }
  return { dates, px };
})()); }
async function fetchNav(code) { try { const j = await (await fetch('https://api.mfapi.in/mf/' + code)).json(); const m = {}; for (const x of j.data || []) { const [dd, mm, yy] = x.date.split('-'); m[`${yy}-${mm}-${dd}`] = Number(x.nav); } return Object.keys(m).length ? m : null; } catch { return null; } }
async function loadBenchmarks() {
  const got = await Promise.all(BENCHMARKS.map(async (b) => [b.id, await fetchNav(b.code)]));
  let ok = 0; for (const [id, m] of got) if (m) { S.navs[id] = m; ok++; }
  S.benchStatus = ok === BENCHMARKS.length ? 'Index history loaded.' : ok ? `Index history loaded for ${ok} of ${BENCHMARKS.length} indices.` : 'Index history could not be loaded (the NAV service did not answer), so there is no index comparison right now.';
}
async function loadFundNavs() {
  if (!S.fundOn) { S.fundNavs = undefined; return; }
  const codes = {}; for (const a of reports()) Object.assign(codes, a.report.fundCodes);
  const missing = Object.entries(codes).filter(([isin]) => !(S.fundNavs && S.fundNavs[isin]));
  if (!missing.length) return;
  S.fundNavs = { ...(S.fundNavs || {}) };
  await Promise.all(missing.map(async ([isin, code]) => { const m = await fetchNav(code); if (m) S.fundNavs[isin] = m; }));
}
function compute(a) {
  const d = S.data; d.priceHistory = S.hist; d.navHistory = S.fundOn ? S.fundNavs : undefined;
  d.shortlist = S.shortlist && S.allocCfg?.swingMatch ? { lines: S.shortlist, match: S.allocCfg.swingMatch, holidays: S.shortlistMeta?.holidays, extra: S.shortlistMeta?.extra, checked: S.shortlistMeta?.checked, liveFrom: S.shortlistMeta?.goLive } : undefined;
  a.report = runPipeline([a.trades], a.broker, d, a.decisions || {}, S.alloc?.acct?.[a.key]?.swing || {});
  a.complete = !!a.report.series && (a.report.funds.mapped === 0 || Object.keys(a.report.fundCodes).every((i) => S.fundNavs?.[i]));
}
async function recomputeAll(withFunds) {
  const accts = [...S.accounts.values()].filter((a) => a.trades.length);
  for (const a of accts) { setStatus('Calculating ' + a.label + '…'); await new Promise((r) => setTimeout(r)); compute(a); render(); }
  setStatus('');
  const withF = accts.filter((a) => Object.keys(a.report.fundCodes).length);
  if (withFunds && S.fundOn && withF.length) {
    setStatus('Loading fund history…'); await loadFundNavs();
    for (const a of withF) { await new Promise((r) => setTimeout(r)); compute(a); render(); }   // only accounts that hold funds change
    setStatus('');
  }
  syncLog().catch(() => {});
}
// The verdict log: a line is written when a held stock's verdict changes (or is first seen), so that later its outcome can be judged. Kept with the account.
async function syncLog() {
  for (const a of S.accounts.values()) {
    if (!a.report) continue;
    const last = new Map(); for (const e of a.verdictLog || []) last.set(e.symbol, e);
    const add = [];
    for (const h of a.report.holdings) {
      const v = verdictOf({ ...h, book: h.book }); if (!v || v.label === 'No verdict' || !v.asOf) continue;
      const l = last.get(h.symbol); if (l && l.verdict === v.label) continue;
      add.push({ date: v.asOf, symbol: h.symbol, verdict: v.label, rule: 'exit test: 200 SMA and swing low', close: v.close, sma200: v.sma200, swingLow: v.swingLow ? v.swingLow.price : null, swingDate: v.swingLow ? v.swingLow.date : null, unrealised: h.value === null ? null : Math.round((h.value - h.cost) * 100) / 100 });
    }
    if (!add.length) continue;
    const by = new Map(); for (const e of [...(a.verdictLog || []), ...add]) by.set(e.symbol + '|' + e.date, e);
    a.verdictLog = [...by.values()].sort((x, y) => x.date.localeCompare(y.date) || x.symbol.localeCompare(y.symbol));
    if (S.canSave && a.saved) { try { const res = await fetch('/api/portfolio', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ label: a.label, broker: a.broker, trades: [], verdictLog: add.slice(0, 1000) }) }); if (!res.ok) console.warn('verdict log not saved', res.status); } catch (e) { console.warn('verdict log not saved', e); } }
  }
  if (S.tab === 'data') render();
}
const setStatus = (t) => { $('status').textContent = t; };
const notify = (t) => { setStatus(t); const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => { el.style.display = 'none'; }, 5000); };

// ---------- selection
function members() {
  const L = reports();
  if (S.sel === 'ALL') return L;
  if (S.sel.startsWith('o:')) return L.filter((a) => ownerOf(a) === S.sel.slice(2));
  return L.filter((a) => a.key === S.sel.slice(2));
}
function selLabel() {
  if (S.sel === 'ALL') return 'Household · all accounts';
  if (S.sel.startsWith('o:')) return S.sel.slice(2) + ' · all accounts';
  return S.accounts.get(S.sel.slice(2))?.label ?? 'Choose account';
}
function build() {
  const ms = members(); if (!ms.length) return null;
  const R = ms.map((a) => a.report);
  const V = { ms, R, flows: R.flatMap((r) => r.flows), divFlows: R.flatMap((r) => r.divFlows), held: R.reduce((a, r) => a + r.performance.held, 0), costOpen: R.reduce((a, r) => a + r.performance.costOpen, 0), realised: R.reduce((a, r) => a + r.performance.realised, 0), unrealised: R.reduce((a, r) => a + r.performance.unrealised, 0), asOf: R[0].performance.asOf };
  V.series = ms.every((a) => a.report.series) ? sumSeries(R.map((r) => r.series)) : null;
  V.complete = ms.every((a) => a.complete);
  const fys = [...new Set(V.flows.map((f) => fy(f.date)))];
  V.periods = periods(fys, V.asOf);
  return V;
}



// ---------- trades: every buy and sell, four views of the same data (display only)
const TF0 = { acct: 'All', book: 'All', kind: 'All', year: 'All', status: 'All', q: '' };
function tradesData(V) {
  const F = { ...TF0, ...(S.tf ?? {}) }, rows = [];
  for (const a of V.ms) for (const t of a.report.history?.txns ?? []) rows.push({ ...t, acct: a.label });
  const stocks = [];
  for (const a of V.ms) for (const x of a.report.history?.stocks ?? []) stocks.push({ ...x, acct: a.label });
  const q = F.q.trim().toLowerCase();
  const okTx = (t) => (F.acct === 'All' || t.acct === F.acct) && (F.kind === 'All' || t.kind === F.kind) && (F.book === 'All' || t.book.split(' + ').includes(F.book)) && (F.year === 'All' || t.date.startsWith(F.year)) && (!q || t.name.toLowerCase().includes(q));
  const tx = rows.filter(okTx), keep = new Set(tx.map((t) => t.acct + '|' + t.key));
  const st = stocks.filter((x) => keep.has(x.acct + '|' + x.key) && (F.status === 'All' || x.status === F.status));
  const stTx = new Set(st.map((x) => x.acct + '|' + x.key)), tx2 = tx.filter((t) => stTx.has(t.acct + '|' + t.key));
  const mm = new Map(); for (const t of tx2) { const ym = t.date.slice(0, 7), m = mm.get(ym) ?? { ym, bought: 0, sold: 0, realised: 0, n: 0 }; if (t.side === 'buy') m.bought += t.value; else { m.sold += t.value; m.realised += t.gain ?? 0; } m.n++; mm.set(ym, m); }
  const years = [...new Set(rows.map((t) => t.date.slice(0, 4)))].sort().reverse();
  return { F, rows, all: stocks, tx: tx2, st, months: [...mm.values()].sort((a, b) => a.ym.localeCompare(b.ym)), years, accts: V.ms.map((a) => a.label) };
}
const px2 = (x) => Number(x).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const fmtD = (d) => { const [y, m, dd] = d.split('-'); return `${+dd} ${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+m - 1]} ${y.slice(2)}`; };
const gcls = (x) => (x > 0 ? 'pos' : x < 0 ? 'neg' : '');
const gtxt = (x) => (x === null || x === undefined ? '—' : `<span class="${gcls(x)}">${money(x)}</span>`);
function txLines(list) {
  return `<table><thead><tr><th>Date</th><th class="num">Units</th><th class="num">Price ₹</th><th class="num">Value ₹</th><th class="num">Realised ₹</th></tr></thead><tbody>${list.map((t) => `<tr><td>${fmtD(t.date)} <span class="sub">· ${t.side === 'buy' ? 'Bought' : 'Sold'}</span></td><td class="num">${+t.qty.toFixed(3)}</td><td class="num">${px2(t.price)}</td><td class="num">${inr(t.value)}</td><td class="num">${t.side === 'sell' ? gtxt(t.gain) : ''}</td></tr>`).join('')}</tbody></table>`;
}

// How each sold holding went (src/pm/tradereview.ts): facts from stored daily closes and the index fund NAV, then a one-line read. Cached per stock.
// Daily volume and delivery %, one file per month, loaded only for the months a review needs (the buy month and the 3 before it).
S.vol = new Map(); S.volFail = new Map(); let volBusy = false, volWant = [];   // volFail: month -> failed attempts (a failed month is retried up to 2 times, never cached as empty)

  const start = ok.reduce((t, x) => t + x.res.rows.find((r) => r.cls === 'direct_equity').amount, 0);
  const trades = ok.flatMap((x) => (x.a.report.journal ?? []).map((t) => ({ ...t, acct: x.a.label, acctKey: x.a.key })));
  const rep = journalReport(trades, start), blocked = [];

  if (ok.some((x) => (x.a.report.resolver?.unexplained ?? []).length)) blocked.push('sells the statements cannot explain');
  if (ok.some((x) => (x.a.report.journalSkipped ?? []).length)) blocked.push('trades left out after a split or demerger');
  if (trades.some((t) => t.closed && t.r === null)) blocked.push('a closed trade with no usable stop');

const normName = (n) => String(n ?? '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').replace(/\b(limited|ltd)\b/g, '').replace(/\s+/g, ' ').trim();

function ordersCard(ok, accts, rows, stcg, P) {

  const chargesOf = (value, type) => { try { return orderCharges({ instrument: '', isin: '', side: 'sell', qty: 1, price: value, value, date: today, time: '', exchange: 'NSE', orderId: '', tradeId: '', kind: 'stock' }, type, 'groww', S.data.charges).total; } catch { return 0; } };
  const plan = Object.keys(need).length ? planSales(lots, need, { today, rules: S.data.taxRules, exit, settings: C.rebalance, chargesOf, slabRate: A.slab > 0 ? A.slab / 100 : undefined }) : { lines: [], skipped: [], unmet: [], taxTotal: 0, slabGains: 0 };
  const moneyHtml = money_.error ? '' : money_.lines.length ? `<div><b>New money ${money(A.money)}</b> goes first, to the classes furthest below target:<table><tbody>${money_.lines.sort((a, b) => b.amount - a.amount).map((l) => `<tr><td>${label(l.cls)}</td><td class="num"><b>${money(l.amount)}</b></td><td class="sub">${esc(l.why)}</td></tr>`).join('')}</tbody></table><div class="sub">Which fund or stock to buy inside each class comes from the fund shortlist and the Swing Desk shortlist; this only sizes the classes.</div></div>` : '';
  const salesHtml = plan.lines.length ? `<div style="margin-top:12px"><b>Sales to bring these back to target</b> (${Object.keys(need).map((c) => label(c) + ' over by ' + money(need[c])).join('; ')})<div style="overflow-x:auto"><table><thead><tr><th>Account</th><th>What</th><th class="num">Units</th><th class="num">Value</th><th class="num">Gain</th><th class="num">Tax (est.)</th><th class="num">Charges</th><th>Why this lot</th></tr></thead><tbody>${plan.lines.map((l) => `<tr><td>${esc(l.account ?? '')}</td><td>${esc(l.name)}</td><td class="num">${(Math.round(l.qty * 1000) / 1000).toLocaleString('en-IN')}</td><td class="num">${money(l.value)}</td><td class="num">${l.gain < 0 ? '−' : ''}${money(Math.abs(l.gain))}</td><td class="num">${l.tax === null ? 'slab rate' : money(l.tax)}</td><td class="num">${money(l.charges)}</td><td class="sub">${esc(l.reason)}${l.loadNote ? '<br><b>' + esc(l.loadNote) + '</b>' : ''}</td></tr>`).join('')}</tbody></table></div><div class="sub">Estimated tax ${money(plan.taxTotal)}${plan.slabGains > 0 ? `, plus ${money(plan.slabGains)} of gains taxed at your slab rate (type it under “Your inputs” to price them)` : ''}. Before surcharge and cess. Exit loads come from data/rules/exit-loads.json; a fund with no recorded load is flagged when bought in the last year.</div><div style="margin-top:8px" class="sub">Done with a class? ${Object.keys(need).map((c) => `<button class="chip" data-acted="${c}" data-a="${esc(V.ms[0].key)}">I acted on ${label(c)}</button>`).join(' ')} (holds further sale suggestions for it until next quarter unless it drifts to twice its band)</div></div>` : '';
  const skipHtml = plan.skipped.length || plan.unmet.length ? `<div class="sub" style="margin-top:10px">${plan.skipped.slice(0, 8).map((k) => `Skipped ${esc(k.name)} (${money(k.value)}): ${esc(k.why)}.`).join('<br>')}${plan.unmet.map((u) => `<br>${label(u.cls)}: ${money(u.short)} still over target, ${esc(u.why)}.`).join('')}</div>` : '';
  const heldHtml = cap.held.length ? `<div class="sub" style="margin-top:10px">${cap.held.map((h) => `${label(h.cls)}: you acted on ${esc(h.since)}, so no new sale is suggested this quarter unless it drifts to twice its band. <a href="#" data-acted-clear="${h.cls}" data-a="${esc(V.ms[0].key)}">Clear</a>`).join('<br>')}</div>` : '';
  const none = !moneyHtml && !salesHtml && !skipHtml ? `<div class="sub">Nothing to do: every class is inside its drift band${A.money > 0 ? '' : '. Enter an amount under “New money” to see where it should go'}.</div>` : '';

}

function wireAlloc() {

  document.querySelectorAll('[data-f]').forEach((el) => { el.onchange = () => { const f = el.dataset.f; set(el.dataset.a, f, f === 'profile' ? el.value : f === 'horizon' ? Math.max(0, Number(el.value) || 0) : Number(el.value) || 0); }; });
  document.querySelectorAll('[data-stop]').forEach((el) => { el.onchange = () => { const A = acctCfg(el.dataset.a); A.stops = { ...(A.stops ?? {}), [el.dataset.stop]: Number(el.value) || 0 }; ALLOC_SAVE(); render(); }; });
  document.querySelectorAll('[data-acted]').forEach((el) => { el.onclick = () => { const A = acctCfg(el.dataset.a); A.acted = { ...(A.acted ?? {}), [el.dataset.acted]: new Date().toISOString().slice(0, 10) }; ALLOC_SAVE(); render(); }; });
  document.querySelectorAll('[data-acted-clear]').forEach((el) => { el.onclick = (e) => { e.preventDefault(); const A = acctCfg(el.dataset.a), m = { ...(A.acted ?? {}) }; delete m[el.dataset.actedClear]; A.acted = m; ALLOC_SAVE(); render(); }; });
  document.querySelectorAll('[data-swing]').forEach((el) => { el.onclick = () => { const A = acctCfg(el.dataset.a); A.swing = { ...(A.swing ?? {}), [el.dataset.k]: el.dataset.swing }; ALLOC_SAVE(); const a = S.accounts.get(el.dataset.a); if (a) compute(a); render(); }; });
  document.querySelectorAll('[data-reset]').forEach((el) => { el.onclick = (e) => { e.preventDefault(); set(el.dataset.a, el.dataset.reset, 0); }; });
  document.querySelectorAll('[data-scope]').forEach((el) => { el.onchange = () => { const A = acctCfg(el.dataset.a), off = new Set(A.off ?? []); el.checked ? off.delete(el.dataset.scope) : off.add(el.dataset.scope); set(el.dataset.a, 'off', [...off]); }; });

}

// ---------- render
function render() {
  S.cur = build(); drawChrome();
  const main = $('main');
  if (!S.accounts.size) { main.innerHTML = `<div class="card empty"><b>No accounts yet.</b><br>Choose “＋ Add files”, pick your tradebooks, and name the account.</div>`; $('drawer').hidden = false; S.autoOpen = true; return; }
  if (S.autoOpen) { S.autoOpen = false; $('drawer').hidden = true; }   // opened only because nothing had loaded yet
  if (!S.cur) { main.innerHTML = `<div class="card empty">${S.accounts.has(S.sel.slice(2)) ? 'This account has no transactions yet. Use “＋ Add files”.' : 'Nothing selected.'}</div>`; return; }
  main.innerHTML = { home, holdings, trades: tradesTab, tax, income, alloc: allocTab, data: dataTab }[S.tab](S.cur);
  if (S.tab === 'home' && S.lastA) wireChart(S.lastA.path, S.bench);
  if (S.tab === 'alloc' || S.tab === 'data') wireAlloc();
  if (S.tab === 'trades' && $('tq')) { let tm; $('tq').oninput = (e) => { if (e.isComposing) return; clearTimeout(tm); const v = e.target.value, pos = e.target.selectionStart; tm = setTimeout(() => { S.tf = { ...(S.tf ?? {}), q: v }; render(); const el = $('tq'); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }, 250); }; $('tq').addEventListener('compositionend', (e) => e.target.dispatchEvent(new Event('input'))); }
  if (S.tab === 'holdings') $('q').oninput = (e) => { S.q = e.target.value; $('hbody').innerHTML = holdingsBody(S.cur); };
  if (S.tab === 'data') { $('fundOn').onchange = async (e) => { S.fundOn = e.target.checked; store.set('fund', S.fundOn ? '1' : '0'); await recomputeAll(true); }; document.querySelectorAll('[data-owner]').forEach((el) => { el.onchange = () => setOwner(el.dataset.owner, el.value.trim()); }); }
  tellParent();
}
function tellParent() { try { if (window.parent !== window) parent.postMessage({ pmHeight: Math.ceil(document.body.getBoundingClientRect().height) + 4 }, '*'); } catch {} }   // body height follows the content, so the frame can shrink as well as grow
new ResizeObserver(tellParent).observe(document.body);

document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); const inMenu = e.target.closest('#sw');
  if (S.menu && !inMenu) { S.menu = false; drawChrome(); }
  if (!t) return;
  if (t.id === 'swBtn') { S.menu = !S.menu; drawChrome(); if (S.menu) $('newAcct')?.focus(); return; }
  if (t.id === 'addBtn') { $('drawer').hidden = !$('drawer').hidden; if (!$('drawer').hidden && S.sel.startsWith('a:')) { const a = S.accounts.get(S.sel.slice(2)); if (a) { $('label').value = a.label; $('owner').value = a.owner || ''; } } return; }
  if (t.dataset.sel !== undefined) { S.sel = t.dataset.sel.startsWith('a:') ? 'a:' + t.dataset.sel.slice(2) : t.dataset.sel; store.set('sel', S.sel); S.menu = false; S.period = 'all'; return render(); }
  if (t.dataset.per) { S.period = t.dataset.per; store.set('period', S.period); return render(); }
  if (t.dataset.tab) { S.tab = t.dataset.tab; return render(); }
  if (t.dataset.bench) { S.bench = t.dataset.bench; store.set('bench', S.bench); return render(); }
  if (t.dataset.kind) { S.kind = t.dataset.kind; return render(); }
  if (t.dataset.tv) { S.tv = t.dataset.tv; return render(); }
  if (t.dataset.tf) { const i = t.dataset.tf.indexOf(':'); S.tf = { ...(S.tf ?? {}), [t.dataset.tf.slice(0, i)]: t.dataset.tf.slice(i + 1) }; return render(); }
  if (t.dataset.vf) { S.vf = t.dataset.vf; return render(); }

document.addEventListener('click', (e) => { const tx = e.target.closest('tr.tr[data-tx]'); if (tx) { (S.txo ??= new Set()); const k = tx.dataset.tx; S.txo.has(k) ? S.txo.delete(k) : S.txo.add(k); return render(); } const tr = e.target.closest('tr.hr[data-sym]'); if (tr) { const k = tr.dataset.sym; S.open.has(k) ? S.open.delete(k) : S.open.add(k); $('hbody').innerHTML = holdingsBody(S.cur); return; } const th = e.target.closest('th[data-sort]'); if (!th) return; const k = th.dataset.sort; S.sort = S.sort.k === k ? { k, d: -S.sort.d } : { k, d: ['name', 'kind', 'book', 'verdict', 'cap'].includes(k) ? 1 : -1 }; render(); });
document.addEventListener('keydown', (e) => {

  }

});

async function decide(acctKey, k, action, unitCost) {
  const a = S.accounts.get(acctKey); if (!a) return;
  a.decisions = { ...(a.decisions || {}) };
  const dec = action === 'clear' ? 'clear' : action === 'price' ? { action, unitCost } : { action };
  if (dec === 'clear') delete a.decisions[k]; else a.decisions[k] = dec;
  compute(a); render();
  if (S.canSave) { try { const res = await fetch('/api/portfolio', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ label: a.label, broker: a.broker, trades: [], decisions: { [k]: dec } }) }); notify(res.ok ? 'Answer saved.' : 'Answer applied here but not saved (' + res.status + ').'); } catch { notify('Answer applied here but not saved.'); } }
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-dec]'); if (!b) return;
  if (b.dataset.dec === 'price') { const v = Number($(b.dataset.in).value); if (!Number.isFinite(v) || v < 0 || $(b.dataset.in).value === '') { $(b.dataset.in).style.borderColor = 'var(--red)'; return; } return decide(b.dataset.acct, b.dataset.k, 'price', v); }
  decide(b.dataset.acct, b.dataset.k, b.dataset.dec);
});
async function api(method, body) { const res = await fetch('/api/portfolio', { method, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }); const j = await res.json().catch(() => ({})); return { ok: res.ok, j, status: res.status }; }
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-acc]'); if (!b) return; const a = S.accounts.get(b.dataset.k); if (!a) return;
  if (b.dataset.acc === 'rename') {
    const n = (prompt('New name for ' + a.label + ':', a.label) || '').trim(); if (!n || n === a.label) return;
    if (!/^[A-Za-z0-9][A-Za-z0-9 _.-]{0,39}$/.test(n)) return notify('Names use letters, numbers and spaces, up to 40.');
    const nk = keyOf(n); if (nk !== a.key && S.accounts.has(nk)) return notify('There is already an account with that name.');
    if (S.canSave) { try { const r = await api('PATCH', { label: a.label, newLabel: n }); if (!r.ok) return notify('Not renamed: ' + (r.j.error || r.status)); } catch { return notify('Not renamed: could not reach the save service.'); } }
    S.accounts.delete(a.key); if (S.sel === 'a:' + a.key) S.sel = 'a:' + nk; if (S.alloc.acct?.[a.key]) { S.alloc.acct[nk] = S.alloc.acct[a.key]; delete S.alloc.acct[a.key]; ALLOC_SAVE(); } a.key = nk; a.label = n; S.accounts.set(nk, a); store.set('sel', S.sel); render(); notify('Renamed to ' + n + '.');
  } else {
    if (!confirm('Delete the account "' + a.label + '" and its ' + a.trades.length + ' transactions' + (S.canSave ? ' from your private store' : ' from this page') + '? This cannot be undone. (Your original files are not affected.)')) return;
    if (S.canSave) { try { const r = await api('DELETE', { label: a.label }); if (!r.ok) return notify('Not deleted: ' + (r.j.error || r.status)); } catch { return notify('Not deleted: could not reach the save service.'); } }
    S.accounts.delete(a.key); if (S.alloc.acct?.[a.key]) { delete S.alloc.acct[a.key]; ALLOC_SAVE(); } if (S.sel === 'a:' + a.key) S.sel = 'ALL'; store.set('sel', S.sel); render(); notify('Deleted ' + a.label + '.');
  }
});
async function setOwner(key, owner) {
  const a = S.accounts.get(key); if (!a) return; a.owner = owner; render();
  if (S.canSave) { try { await fetch('/api/portfolio', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ label: a.label, broker: a.broker, owner: owner || undefined, trades: [] }) }); } catch {} }
}

// ---------- start up and saving
(async () => {
  try {
    const hp = loadHist(), bench = loadBenchmarks().then(() => render());       // the big downloads run side by side
    const [feed, dem, ipo, amfi, fo, charges, taxRules, divRules, px] = await Promise.all(['corp-actions-history', 'demergers', 'ipos', 'amfi-schemes', 'fund-overrides', 'charges', 'tax', 'dividend', 'prices'].map(J));
    S.data = { feed, demergers: dem.records, ipos: ipo.records, amfi: amfi.rows, fundOverrides: fo.records, charges, taxRules, divRules, prices: px.prices, pricesAsOf: px.asOf };
    S.allocCfg = await fetch('pm-data/allocation.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
    S.segments = await fetch('pm-data/segments.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
    S.resultsNext = await fetch('pm-data/results-next.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
    { const sj = await fetch('pm-data/shortlist.json').then((r) => (r.ok ? r.json() : null)).catch(() => null); S.shortlist = sj?.lines ?? null; S.shortlistMeta = sj; }
    S.exitLoads = await fetch('pm-data/exit-loads.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
    S.fundScores = await fetch('data/funds.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
    S.dash = await fetch('data/dashboard.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
    S.ctx = await fetch('pm-data/context.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
    S.track = await fetch('pm-data/track-record.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
    S.regime = await fetch('pm-data/regime.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
    S.hist = await hp; $('run').disabled = false; setStatus(`Public data ready (prices as of ${px.asOf}).`);
    await loadSaved();
    await recomputeAll(true);
    await bench; render();
  } catch (e) { setStatus('Could not load public data: ' + e.message); }
  render();
})();
async function loadSaved() {
  try {
    const res = await fetch('/api/portfolio', { headers: { accept: 'application/json' }, cache: 'no-store' });
    if (!res.ok) { const e = await res.json().catch(() => ({})); const hint = { 401: 'the login was not accepted: check POLICY_AUD, TEAM_DOMAIN and ALLOWED_EMAILS, and that Access covers this address', 404: 'the save route is not deployed on this address', 502: 'GitHub refused: check GITHUB_TOKEN (Contents read and write) and REPO' }[res.status] || 'unexpected response'; setStatus(`Saving is not available (${res.status} ${e.error || ''}${e.reason ? ' - ' + e.reason : ''}): ${hint}.`); return; }
    const j = await res.json(); S.canSave = true; $('saveBox').hidden = false;
    for (const a of j.accounts) { const key = keyOf(a.label); S.accounts.set(key, { key, label: a.label, broker: a.broker, owner: a.owner || '', decisions: a.decisions || {}, verdictLog: a.verdictLog || [], saved: true, trades: a.trades, report: null }); if (a.settings) { S.alloc.acct = S.alloc.acct ?? {}; S.alloc.acct[key] = JSON.parse(JSON.stringify(a.settings)); S.accounts.get(key).settingsSaved = JSON.parse(JSON.stringify(a.settings)); } }
    if (S.sel.startsWith('a:') && !S.accounts.has(S.sel.slice(2))) S.sel = 'ALL';
    if (S.sel.startsWith('o:') && ![...S.accounts.values()].some((a) => ownerOf(a) === S.sel.slice(2))) S.sel = 'ALL';
    ALLOC_SAVE();
    setStatus(j.accounts.length ? `Loaded ${j.accounts.length} saved account(s).` : 'No saved accounts yet. Add files, and keep Save ticked to keep them.');
  } catch (e) { setStatus('Saving is not available (could not reach /api/portfolio: ' + e.message + ').'); }
}
$('run').onclick = async () => {
  const files = [...$('files').files], label = ($('label').value || '').trim(), owner = ($('owner').value || '').trim();
  if (!files.length) return setStatus('Choose at least one file.');
  if (!/^[A-Za-z0-9][A-Za-z0-9 _.-]{0,39}$/.test(label)) return setStatus('Give the account a name (letters, numbers, spaces; up to 40).');
  if (owner && !/^[A-Za-z0-9][A-Za-z0-9 _.-]{0,39}$/.test(owner)) return setStatus('Owner name: letters and numbers only.');
  setStatus('Reading files…'); await new Promise((r) => setTimeout(r, 20));
  try {
    const batches = [], notes = [];
    for (const f of files) {
      const rows = /\.xlsx$/i.test(f.name) ? (await readXlsxAsync(new Uint8Array(await f.arrayBuffer())))[0].rows : parseCsv(await f.text());
      const r = readRows(rows, { filename: f.name });
      if (r.rejected) notes.push(`${f.name}: not read (${r.rejected})`); else batches.push(r.trades);
    }
    if (!batches.length) throw new Error('No readable tradebook among the files. ' + notes.join(' '));
    const key = keyOf(label), ex = S.accounts.get(key);
    const detected = files.some((f) => /tradebook/i.test(f.name) || /\.csv$/i.test(f.name)) ? 'zerodha' : 'groww';
    const broker = $('broker').value === 'auto' ? (ex && ex.trades.length ? ex.broker : detected) : $('broker').value;
    const a = ex ?? { key, label, broker, owner: '', trades: [], report: null };
    a.label = ex ? ex.label : label; a.broker = broker; if (owner) a.owner = owner;
    if (!a.owner) setStatus('Tip: set an owner for this account (Data tab) so tax is worked out for the right person.');
    a.trades = mergeTrades([a.trades, ...batches]).trades; S.accounts.set(key, a);
    compute(a); S.sel = 'a:' + key; store.set('sel', S.sel); render();
    let msg = `Done: ${a.label} now has ${a.trades.length} transactions.${notes.length ? ' ' + notes.join(' ') : ''}`;
    if (S.canSave && $('save').checked) {
      const res = await fetch('/api/portfolio', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ label: a.label, broker, owner: a.owner || undefined, trades: batches.flat() }) });
      const j = await res.json().catch(() => ({})); msg += res.ok ? ` Saved (${j.added} new).` : ` Not saved: ${j.error || res.status}.`; if (res.ok) a.saved = true;
    }
    notify(msg); $('files').value = ''; await recomputeAll(true);
  } catch (e) { setStatus('Error: ' + e.message); console.error(e); }
};
